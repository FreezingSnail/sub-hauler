<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story handoff artwork v1</title><style>body{background:#181d24;color:#eee;font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px}article{border-top:1px solid #566;padding:20px 0}img{image-rendering:pixelated;background:#000}figure{margin:14px 0;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}.large{width:512px;height:256px}.poses img{width:256px;height:128px;margin:0 8px 8px 0}button{padding:8px 14px}a{color:#8ed4ff}small{display:block}h2{margin:0 0 8px}</style><h1>Story handoff artwork · v1</h1><p>Four poses, 300 ms each (1.2 s loop). Native 128×64 frames are authoritative. Human artistic review: unreviewed. Text remains separate.</p><button id="play">Pause</button> <button id="step">Next pose</button><span id="phase"></span><main></main><script>
const scenes=[['tidewall-filters','FIRST · Tidewall filters','Two pleated filter cartridges on a cradle beside the open hold.'],['deep-anchor-dispatch','HOME · Deep Anchor dispatch','Sealed physical records case with clasp and return supplies.'],['cormorant-core','BEACON · Cormorant core','Ridged beacon core loaded at the departure berth.'],['restoration-ready','Joint restoration · ready','Completed pump and lift operate in a neutral service bay.']];
for(const [id,title,copy]of scenes){const a=document.createElement('article');a.innerHTML=`<h2>${title}</h2><p>${copy}</p><figure><div><img class="live" data-scene="${id}" width="128" height="64" src="${id}/bundle/frames/000.png"><small>Native</small></div><div><img class="live large" data-scene="${id}" src="${id}/bundle/frames/000.png"><small>4× nearest neighbor</small></div></figure><p><a href="${id}/bundle/contact_sheet.html">Pixelgen contact sheet</a> · <a href="${id}/validation.json">Validation evidence</a></p><div class="poses">${[0,1,2,3].map(p=>`<img alt="Pose ${p+1}" src="${id}/bundle/frames/00${p}.png">`).join('')}</div>`;document.querySelector('main').append(a)}
let phase=0,playing=true;function render(){document.querySelectorAll('.live').forEach(i=>i.src=`${i.dataset.scene}/bundle/frames/00${phase}.png`);document.querySelector('#phase').textContent=` Pose ${phase+1} / 4`};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#play').textContent='Play';phase=(phase+1)%4;render()};setInterval(()=>{if(playing){phase=(phase+1)%4;render()}},300);render();
</script></html>
